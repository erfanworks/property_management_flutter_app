name: imusa04_landlord_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  shared_preferences: ^2.5.5
  cached_network_image: ^3.4.1
  flutter_screenutil: ^5.9.3
  google_fonts: ^8.0.2
  flutter_svg: ^2.2.4
  smooth_page_indicator: ^2.0.1
  pinput: ^6.0.2
  carousel_slider: ^5.1.2
  dotted_border: ^3.1.0
  image_picker: ^1.2.1
  pdf: ^3.13.1
  printing: ^5.15.1
  file_picker: ^13.1.0
  flutter_quill: ^11.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo_2.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A3D8F"
  adaptive_icon_foreground: "assets/images/app_logo_2.png"
  remove_alpha_ios: true
flutter:
  uses-material-design: true

  assets:
      - assets/images/
      - assets/icons/
